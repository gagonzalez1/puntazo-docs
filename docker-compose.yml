services:
  docs:
    build:
      context: .
    container_name: puntazo-docs
    restart: unless-stopped
    ports:
      - "${PUNTAZO_DOCS_BIND:-127.0.0.1}:${PUNTAZO_DOCS_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
