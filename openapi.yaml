      summary: Solicita baja lógica de una marca sin suscripción activa
      operationId: deactivateBrand
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03, PC-09]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Marca desactivada
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de aplicación o Backoffice según la audiencia de la ruta.
  headers:
    IdempotentReplayed:
      description: true cuando se reprodujo una respuesta persistida previamente.
      schema: { type: boolean }
  parameters:
    BrandId:
      name: id_marca
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    BranchId:
      name: id_sucursal
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    OptionalBranchId:
      name: id_sucursal
      in: query
      schema: { type: integer, format: int64, minimum: 1 }
    UserId:
      name: id_usuario
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CardId:
      name: id_tarjeta
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    BenefitId:
      name: id_beneficio
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InvitationId:
      name: id_invitacion
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 512 }
    FileId:
      name: id_archivo
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MovementId:
      name: id_movimiento
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PlanId:
      name: id_plan
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SubscriptionId:
      name: id_suscripcion
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ProgramTypePath:
      name: tipo_programa
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProgramType' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyPath:
      name: idempotency_key
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión entera actual del recurso, por ejemplo `\"3\"`.
      schema: { type: string, pattern: '^\"[1-9][0-9]*\"$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      schema: { type: string, minLength: 2, maxLength: 100 }
    Active:
      name: activo
      in: query
      schema: { type: boolean }
    Sort:
      name: sort
      in: query
      schema: { type: string, maxLength: 40 }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    From:
      name: desde
      in: query
      description: Límite inclusivo.
      schema: { type: string, format: date-time }
    Until:
      name: hasta
      in: query
      description: Límite exclusivo.
      schema: { type: string, format: date-time }
    Timezone:
      name: zona_horaria
      in: query
      schema: { type: string, default: America/Argentina/Buenos_Aires }
  responses:
    HealthOk:
      description: Servicio listo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthResponse' }
    BadRequest:
      description: Request mal formado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: BAD_REQUEST
            message: El cuerpo JSON no es válido.
            details: {}
            request_id: req_01K1EXAMPLE
    Unauthenticated:
      description: Credenciales ausentes, inválidas o vencidas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: UNAUTHENTICATED
            message: La sesión no es válida.
            details: {}
            request_id: req_01K1EXAMPLE
    RecentAuthRequired:
      description: La sesión es válida pero auth_time supera los 10 minutos permitidos para anonimizar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: RECENT_AUTH_REQUIRED
            message: Vuelva a autenticarse para anonimizar la cuenta.
            details: { max_auth_age_seconds: 600 }
            request_id: req_01K1EXAMPLE
    Forbidden:
      description: Actor autenticado sin permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: FORBIDDEN
            message: No tiene permiso para realizar esta acción.
            details: {}
            request_id: req_01K1EXAMPLE
    NotFound:
      description: Recurso inexistente o no visible para el actor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: RESOURCE_NOT_FOUND
            message: No se encontró el recurso solicitado.
            details: {}
            request_id: req_01K1EXAMPLE
    Conflict:
      description: Conflicto de estado, unicidad o idempotencia
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: INVALID_STATE_TRANSITION
            message: El recurso no admite esta transición.
            details: {}
            request_id: req_01K1EXAMPLE
    OwnershipTransferRequired:
      description: La cuenta es el último propietario activo de una marca
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: OWNERSHIP_TRANSFER_REQUIRED
            message: Transfiera la propiedad o cierre la marca antes de anonimizar la cuenta.
            details: { id_marca: 1 }
            request_id: req_01K1EXAMPLE
    PreconditionFailed:
      description: La versión enviada en If-Match está desactualizada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: PRECONDITION_FAILED
            message: El recurso fue modificado por otra operación.
            details: { current_version: 4 }
            request_id: req_01K1EXAMPLE
    PayloadTooLarge:
      description: El archivo supera 5 MiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: IMAGE_TOO_LARGE
            message: La imagen supera el tamaño máximo permitido.
            details: { max_bytes: 5242880 }
            request_id: req_01K1EXAMPLE
    UnsupportedMediaType:
      description: El tipo real del archivo no está permitido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: IMAGE_TYPE_NOT_ALLOWED
            message: El formato de imagen no está permitido.
            details: { allowed: [image/jpeg, image/png, image/webp] }
            request_id: req_01K1EXAMPLE
    ValidationError:
      description: Campos inválidos o regla de negocio no satisfecha
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: VALIDATION_ERROR
            message: Revise los datos enviados.
            details:
              fields:
                nombre: [El campo es obligatorio.]
            request_id: req_01K1EXAMPLE
    RateLimited:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          description: Segundos mínimos antes del próximo intento.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: RATE_LIMITED
            message: Demasiados intentos. Intente más tarde.
            details: {}
            request_id: req_01K1EXAMPLE
    DependencyUnavailable:
      description: Dependencia o lock no disponible temporalmente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: DEPENDENCY_UNAVAILABLE
            message: El servicio no está disponible temporalmente.
            details: {}
            request_id: req_01K1EXAMPLE
  schemas:
    RequestId:
      type: string
      description: Correlación de logs; no contiene datos personales.
      example: req_01K1EXAMPLE
    Timestamp:
      type: string
      format: date-time
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
            - RECENT_AUTH_REQUIRED
            - FORBIDDEN
            - RESOURCE_NOT_FOUND
            - EMAIL_ALREADY_EXISTS
            - MEMBERSHIP_REQUIRED
            - BRANCH_NOT_ASSIGNED
            - SUBSCRIPTION_INACTIVE
            - PROGRAM_INACTIVE
            - PROGRAM_PLAN_MISMATCH
            - INVALID_QR
            - CARD_INACTIVE
            - INSUFFICIENT_BALANCE
            - BENEFIT_INACTIVE
            - IDEMPOTENCY_CONFLICT
            - INVITATION_EXPIRED
            - INVITATION_EMAIL_MISMATCH
            - INVITATION_ALREADY_USED
            - LAST_OWNER
            - OWNERSHIP_TRANSFER_REQUIRED
            - INVALID_STATE_TRANSITION
            - BRANCH_NOT_BILLABLE
            - RELEASE_ACCESS_INACTIVE
            - IMAGE_TOO_LARGE
            - IMAGE_TYPE_NOT_ALLOWED
            - PREVIEW_EXPIRED
            - PRECONDITION_FAILED
            - RATE_LIMITED
            - INTERNAL_ERROR
            - DEPENDENCY_UNAVAILABLE
        message: { type: string, minLength: 1, maxLength: 500 }
        details: { type: object, additionalProperties: true }
        request_id: { $ref: '#/components/schemas/RequestId' }
    AccountType:
      type: string
      enum: [CLIENTE_FINAL, PERSONAL_MARCA]
    BrandRole:
      type: string
      enum: [PROPIETARIO, ADMINISTRADOR, OPERADOR]
    BackofficeRole:
      type: string
      enum: [ADMIN_SISTEMA, FINANZAS, SOPORTE]
    ProgramType:
      type: string
      enum: [SELLOS, PUNTOS]
      description: AMBOS se reserva para un MVP posterior y no se acepta en operaciones del MVP 1.
    BalanceType:
      type: string
      enum: [SELLOS, PUNTOS]
    MovementOperation:
      type: string
      enum: [ACUMULACION, CANJE, AJUSTE]
    MovementDirection:
      type: string
      enum: [CREDITO, DEBITO]
    InvitationStatus:
      type: string
      enum: [PENDIENTE, ACEPTADA, REVOCADA, VENCIDA]
    SubscriptionStatus:
      type: string
      enum: [PENDIENTE, ACTIVA, CANCELACION_PROGRAMADA, SUSPENDIDA, CANCELADA, VENCIDA]
    SubscriptionBranchStatus:
      type: string
      enum: [ACTIVA, SUSPENDIDA, BAJA_PROGRAMADA]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
        schema_version: { type: string }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version, commit, schema_version]
      properties:
        version: { type: string, example: 1.0.0 }
        commit: { type: string, pattern: '^[0-9a-f]{7,40}$' }
        schema_version: { type: string, example: '0007' }
    User:
      type: object
      additionalProperties: false
      required: [id_usuario, email, nombre, tipo_cuenta, activo, version, created_at, updated_at]
      properties:
