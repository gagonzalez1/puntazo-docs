      x-puntazo-decisions: [D-R01]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Marca visible para la membresía
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Marcas]
      summary: Actualiza perfil, branding o plantilla
      operationId: updateBrand
      x-puntazo-authority: APROBADA_USUARIO
