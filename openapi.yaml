        '401': { $ref: '#/components/responses/Unauthenticated' }
  /planes:
    x-puntazo-release-stage: DEFERRED_BILLING
    get:
      tags: [Catálogos]
      summary: Lista planes contratables por marcas
      operationId: listPlans
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-R09]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - name: activo
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Catálogo de planes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListEnvelope'
  /card-templates:
    get:
      tags: [Catálogos]
      summary: Lista plantillas compatibles
      operationId: listCardTemplates
