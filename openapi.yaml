      parameters:
        - name: tipo_programa
          in: query
          schema:
            $ref: '#/components/schemas/ProgramType'
        - name: activo
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Plantillas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTemplateListEnvelope'
  /marcas:
    get:
      tags: [Marcas]
      summary: Lista las marcas del personal autenticado
      operationId: listBrands
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-01, D-R01]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Marcas visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
    post:
      tags: [Marcas]
      summary: Crea una marca y la membresía del propietario
      operationId: createBrand
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-R07]
      x-puntazo-implementation: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
      responses:
        '201':
          description: Marca y propietario creados en una transacción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandResponse'
