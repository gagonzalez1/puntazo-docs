openapi: 3.1.0
info:
  title: Puntazo API
  version: 1.1.0-production-readiness
  description: |
    Contrato objetivo del backend Puntazo.

    Contrato objetivo con decisiones aprobadas PR-01 a PR-08 y propuestas futuras.
    La primera release es gratuita, requiere código de acceso y no incluye billing.
    Las extensiones x-puntazo-authority, x-puntazo-implementation y
    x-puntazo-release-stage separan aprobación, implementación y alcance de release.
  contact:
    name: Equipo Puntazo
servers:
  - url: https://api.example.com/v1
    description: Producción — dominio pendiente
  - url: http://localhost:8080/v1
    description: Desarrollo local
tags:
  - name: Health
  - name: Auth
  - name: Cuenta
  - name: Catálogos
  - name: Marcas
  - name: Sucursales
  - name: Programas
  - name: Beneficios
  - name: Personal
  - name: Invitaciones
  - name: Imágenes
  - name: Clientes
  - name: Tarjetas
  - name: Movimientos
  - name: Suscripciones
  - name: Analíticas
  - name: Backoffice
security:
  - bearerAuth: []
x-puntazo-release-profile:
  id: FREE_ACCESS_V1
  billing: disabled
  native_application_id: com.puntazo.app
  decisions: [PR-01, PR-02, PR-03, PR-04, PR-05, PR-06, PR-07, PR-08]
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Comprueba que el proceso está vivo
      operationId: getLiveness
      security: []
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [PC-11]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      summary: Comprueba API, esquema y PostgreSQL
      operationId: getReadiness
      security: []
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [PC-11]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /version:
    get:
      tags: [Health]
      summary: Devuelve versión de aplicación, commit y esquema
      operationId: getVersion
      security: []
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [PC-11]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Versión desplegada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registra un cliente final o personal de marca
      operationId: registerUser
      security: []
      x-puntazo-authority: MIXED
      x-puntazo-decisions: [D-05, D-R06, D-R07, PC-12]
      x-puntazo-implementation: DIVERGENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: Cuenta creada y sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /marcas/{id_marca}/sucursales:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Sucursales]
      summary: Lista sucursales de la marca
      operationId: listBranches
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [D-R02, PC-04]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Sucursales visibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sucursales]
      summary: Crea una sucursal habilitada por el acceso gratuito de la release
      operationId: createBranch
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [D-R02, D-R03, PC-03]
      x-puntazo-implementation: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBranchRequest' }
      responses:
        '201':
          description: Sucursal creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{id_marca}/sucursales/{id_sucursal}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [Sucursales]
      summary: Obtiene una sucursal
      operationId: getBranch
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [D-R02]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Sucursal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sucursales]
      summary: Actualiza datos operativos; la facturación sólo cambia desde Backoffice
      operationId: updateBranch
      x-puntazo-authority: PROPUESTA_CODEX
      x-puntazo-decisions: [D-R02, PC-03, PC-04]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBranchRequest' }
      responses:
        '200':
          description: Sucursal actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sucursales]
      summary: Da de baja lógica una sucursal preservando historial
      operationId: deactivateBranch
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03, PC-09]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Sucursal desactivada }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /marcas/{id_marca}/programas:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Programas]
      summary: Lista programas de fidelidad de la marca
      operationId: listPrograms
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-07, D-R05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Programas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramListEnvelope' }
    post:
      tags: [Programas]
      summary: Crea el programa habilitado para la release gratuita
      operationId: createProgram
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [D-07, D-R05, PR-02]
      x-puntazo-implementation: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProgramRequest' }
      responses:
        '201':
          description: Programa creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{id_marca}/programas/{tipo_programa}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/ProgramTypePath'
    get:
      tags: [Programas]
      summary: Obtiene un programa por tipo
      operationId: getProgram
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-07]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Programa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Programas]
      summary: Reemplaza reglas del programa
      operationId: replaceProgram
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [D-07, PR-02, PR-03]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProgramRequest' }
      responses:
        '200':
          description: Programa actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Programas]
      summary: Da de baja lógica un programa preservando tarjetas y movimientos
      operationId: deactivateProgram
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Programa desactivado }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /marcas/{id_marca}/beneficios:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Beneficios]
      summary: Lista beneficios configurados
      operationId: listBenefits
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-04, PC-06]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Active'
        - name: tipo_programa
          in: query
          schema: { $ref: '#/components/schemas/ProgramType' }
      responses:
        '200':
          description: Beneficios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitPage' }
    post:
      tags: [Beneficios]
      summary: Crea un beneficio
      operationId: createBenefit
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [D-04, PR-03]
      x-puntazo-implementation: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBenefitRequest' }
      responses:
        '201':
          description: Beneficio creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{id_marca}/beneficios/{id_beneficio}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/BenefitId'
    get:
      tags: [Beneficios]
      summary: Obtiene un beneficio
      operationId: getBenefit
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-04]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Beneficio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Beneficios]
      summary: Reemplaza y permite reactivar un beneficio
      operationId: replaceBenefit
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceBenefitRequest' }
      responses:
        '200':
          description: Beneficio reemplazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitEnvelope' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Beneficios]
      summary: Actualiza parcialmente un beneficio
      operationId: updateBenefit
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBenefitRequest' }
      responses:
        '200':
          description: Beneficio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitEnvelope' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Beneficios]
      summary: Da de baja lógica un beneficio
      operationId: deactivateBenefit
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03, PC-09]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Beneficio desactivado }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /marcas/{id_marca}/personal:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Personal]
      summary: Lista membresías y asignaciones de la marca
      operationId: listBrandMembers
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-01, D-R04, PC-02]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: rol
          in: query
          schema: { $ref: '#/components/schemas/BrandRole' }
        - $ref: '#/components/parameters/Active'
      responses:
        '200':
          description: Personal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipPage' }
  /marcas/{id_marca}/personal/{id_usuario}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Personal]
      summary: Cambia rol, asignaciones o estado de una membresía
      operationId: updateBrandMember
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [D-R04, PR-03, PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMembershipRequest' }
      responses:
        '200':
          description: Membresía actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Personal]
      summary: Revoca una membresía respetando la regla de último propietario
      operationId: revokeBrandMember
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-03, PR-05, PC-09]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Membresía revocada }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /marcas/{id_marca}/invitaciones:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Invitaciones]
      summary: Lista invitaciones de la marca
      operationId: listInvitations
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: Invitaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPage' }
    post:
      tags: [Invitaciones]
      summary: Invita personal con rol y sucursales
      operationId: createInvitation
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitación creada; el token sólo se envía por canal seguro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{id_marca}/invitaciones/{id_invitacion}:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Invitaciones]
      summary: Revoca una invitación pendiente
      operationId: revokeInvitation
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '204': { description: Invitación revocada }
        '409': { $ref: '#/components/responses/Conflict' }
  /marcas/{id_marca}/invitaciones/{id_invitacion}/reenviar:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitaciones]
      summary: Revoca el token previo y extiende 72 horas
      operationId: resendInvitation
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Invitación renovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitaciones/{token}:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [Invitaciones]
      summary: Obtiene la vista pública limitada de una invitación
      operationId: getInvitationByToken
      security: []
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '200':
          description: Marca, email enmascarado, rol y vencimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicInvitationEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitaciones/{token}/aceptar:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitaciones]
      summary: Acepta una invitación para el email autenticado
      operationId: acceptInvitation
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-05]
      x-puntazo-implementation: NOT_IMPLEMENTED
      responses:
        '201':
          description: Membresía y asignaciones creadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{id_marca}/imagenes:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/BrandId'
    post:
      tags: [Imágenes]
      summary: Sube y normaliza una imagen de marca
      operationId: uploadBrandImage
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-04]
      x-puntazo-implementation: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageUploadRequest' }
      responses:
        '201':
          description: Archivo almacenado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{id_marca}/imagenes/{id_archivo}:
    x-puntazo-release-stage: FREE_ACCESS_V1
    parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/FileId'
    delete:
      tags: [Imágenes]
      summary: Desvincula una imagen y agenda borrado físico
      operationId: deleteBrandImage
      x-puntazo-authority: APROBADA_USUARIO
      x-puntazo-decisions: [PR-04]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Borrado diferido aceptado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionJobEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /marcas/{id_marca}/clientes:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Clientes]
      summary: Lista clientes y saldos consolidados de la marca
      operationId: listBrandCustomers
      x-puntazo-authority: ACORDADA
      x-puntazo-decisions: [D-11, D-R01]
      x-puntazo-implementation: NOT_IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
